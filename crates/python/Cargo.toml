[package]
name = "ml-cars-python"
version = "0.1.0"
edition = "2024"
[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
[dependencies]
ml-cars-sim = { path = "../sim" }
ml-cars-controllers = { path = "../controllers" }
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
numpy = "=0.29.0"
serde_json.workspace = true
