[workspace]
members = ["crates/sim", "crates/controllers", "crates/python", "crates/viewer"]
default-members = [".", "crates/sim", "crates/controllers"]
resolver = "2"

[package]
name = "ml_cars"
version = "0.1.0"
edition = "2024"

[dependencies]
ml-cars-sim = { path = "crates/sim" }
ml-cars-controllers = { path = "crates/controllers" }
serde_json = "1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
